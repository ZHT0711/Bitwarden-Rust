[workspace.lints.clippy]
disallowed_macros = "deny"
unused_async = "warn"
unwrap_used = "deny"
string_slice = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Some errors are logged where they occur, so there is no need to return them.
result_unit_err = "allow"
# `chunks_exact(N)` reads better than the suggested `as_chunks::<N>().0`.
chunks_exact_to_as_chunks = "allow"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("uniffi", "wasm"))',
    'cfg(dylint_lib, values("bitwarden_lints"))',
    # Set by CI on non-commercial builds; see bitwarden_license/bitwarden-commercial-marker.
    'cfg(bitwarden_ensure_non_commercial)',
] }

[workspace.metadata.dylint]
libraries = [{ path = "support/lints" }]

# Pinned binary cargo tools used by CI and `scripts/lint.sh`.
# Install the runner once with `cargo install cargo-run-bin --locked`, then
# invoke any tool via `cargo bin <tool> <args>`. See README for details.
[workspace.metadata.bin]
cargo-deny = { version = "0.20.0", locked = true }
cargo-sort = { version = "2.0.2", locked = true }
cargo-udeps = { version = "0.1.57", locked = true }
cargo-hack = { version = "0.6.33", locked = true }
cargo-llvm-cov = { version = "0.9.0", locked = true }
cargo-release = { version = "0.25.20", locked = true }
cargo-edit = { version = "0.13.6", locked = true, bins = ["cargo-set-version"] }
cargo-dylint = { version = "6.0.0", locked = true }
dylint-link = { version = "6.0.0", locked = true }
cross = { version = "0.2.5", git = "https://github.com/cross-rs/cross.git", rev = "185398b1b885820515a212de720a306b08e2c8c9", locked = true }
clippy-sarif = { version = "0.4.2", git = "https://github.com/psastras/sarif-rs.git", rev = "11c33a53f6ffeaed736856b86fb6b7b09fabdfd8", locked = true }
sarif-fmt = { version = "0.4.2", git = "https://github.com/psastras/sarif-rs.git", rev = "11c33a53f6ffeaed736856b86fb6b7b09fabdfd8", locked = true }

# Turn on a small amount of optimisation in development mode. This might interfere when trying to use a debugger
# if the compiler decides to optimize some code away, if that's the case, it can be set to 0 or commented out
[profile.dev]
opt-level = 1

# Compile all dependencies with some optimizations when building this crate on debug
# This slows down clean builds by about 50%, but the resulting binaries can be orders of magnitude faster
# As clean builds won't occur very often, this won't slow down the development process
[profile.dev.package."*"]
opt-level = 2

# Turn on LTO on release mode
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

# Enable optimization for the bitwarden-crypto crate. This will increase the binary size slightly (~0.1MB),
# but it will more aggressively inline functions. This will help us avoid extra stack copies of keys and
# other sensitive values being left behind without cleanup.
[profile.release.package.bitwarden-crypto]
opt-level = 3

# Heavy crypto operations are optimized for speed instead of size. Each crate costs a few KB but
# shortens unlock, vault decryption and ML-DSA operations. RSA crates are left out: building them
# for speed added ~70 KB with no measurable gain (their generic code is instantiated in callers).

# Bulk vault decryption: AES-CBC, EncString base64, reading ciphers from JS
[profile.release.package.aes]
opt-level = 3

[profile.release.package.cbc]
opt-level = 3

[profile.release.package.data-encoding]
opt-level = 3

[profile.release.package.serde-wasm-bindgen]
opt-level = 3

# V2 (COSE) vault decryption: CBOR parsing and XAES-256-GCM
[profile.release.package.ciborium]
opt-level = 3

[profile.release.package.ciborium-ll]
opt-level = 3

[profile.release.package.coset]
opt-level = 3

[profile.release.package.aes-gcm]
opt-level = 3

[profile.release.package.xaes-256-gcm]
opt-level = 3

[profile.release.package.polyval]
opt-level = 3

# KDFs: PBKDF2 (sha2, hmac) and Argon2id (argon2, blake2)
[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3

[profile.release.package.hmac]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

# ML-DSA: signing, verification and key generation
[profile.release.package.keccak]
opt-level = 3

[profile.release.package.ml-dsa]
opt-level = 3

[profile.release.package.module-lattice]
opt-level = 3

[profile.release.package.shake]
opt-level = 3

# Stripping the binary reduces the size by ~30%, but the stacktraces won't be usable anymore.
# This is fine as long as we don't have any unhandled panics, but let's keep it disabled for now
# strip = true
