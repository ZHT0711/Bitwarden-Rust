[package]
name = "bitwarden-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes-gcm.workspace = true
async-trait.workspace = true
argon2.workspace = true
base64.workspace = true
bitwarden-auth.workspace = true
bitwarden-api-api.workspace = true
bitwarden-api-base.workspace = true
bitwarden-vault.workspace = true
bitwarden-state.workspace = true
bitwarden-crypto.workspace = true
bitwarden-crypto-sync-handler.workspace = true
bitwarden-generators.workspace = true
bitwarden-fido.workspace = true
bw-sdk-core = { workspace = true, features = ["internal"] }
bytes.workspace = true
chrono.workspace = true
hmac.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
win_webauthn = { path = "../../vendor/win_webauthn" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
bw-sdk-core = { workspace = true, features = ["internal", "test-fixtures"] }
bitwarden-api-api = { workspace = true, features = ["mockall"] }
