[workspace]
resolver = "2"
members = [
    "crates/bytewarden-core",
]
exclude = ["apps/Bytewarden.Gpui", "vendor/sdk-internal", "vendor/win_webauthn"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
aes = "0.9"
aes-gcm = "0.10"
async-trait = "0.1"
argon2 = "0.5"
base64 = "0.22"
bitwarden-generators = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-fido = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-auth = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-api-base = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-send = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-state = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-crypto-sync-handler = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bw-sdk-core = { package = "bitwarden-core", git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bitwarden-sensitive-value = { git = "https://github.com/bitwarden/sdk-internal", rev = "56c7617b23501af70221094cdee59e10b2a9d8d2" }
bytes = "1"
cbc = { version = "0.2", features = ["zeroize"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
hmac = "0.13"
http = "1"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "stream", "system-proxy"] }
reqwest-middleware = { version = "0.5", features = ["form", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "fs", "io-util"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[patch."https://github.com/bitwarden/sdk-internal"]
bitwarden-core = { path = "vendor/sdk-internal/crates/bitwarden-core" }
